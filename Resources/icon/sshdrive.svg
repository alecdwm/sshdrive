<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>SSH Drive</title>

  <!--
    macOS app icon grid: 1024 canvas, artwork confined to the 824x824 centred plate.
    The plate is the superellipse |x/412|^5 + |y/412|^5 = 1 about (512, 512), fitted with
    24 cubic segments (max deviation 0.24 px), which is the continuous-curvature corner
    Apple's icon shape uses rather than a constant-radius round rect.
    Every PNG in Apps/Agent/Assets.xcassets is rendered from this file by
    scripts/render-icon.sh.
  -->

  <defs>
    <path id="plate"
     d="M 924.0 512.0 C 924.0 573.0 925.0 634.1 922.6 695.0 C 921.3 727.8 918.9 760.9 911.1 792.8
        C 904.1 821.2 891.3 850.0 870.7 870.7 C 850.0 891.3 821.2 904.1 792.8 911.1
        C 760.9 918.9 727.8 921.3 695.0 922.6 C 634.1 925.0 573.0 924.0 512.0 924.0
        C 451.0 924.0 389.9 925.0 329.0 922.6 C 296.2 921.3 263.1 918.9 231.2 911.1
        C 202.8 904.1 174.0 891.3 153.3 870.7 C 132.7 850.0 119.9 821.2 112.9 792.8
        C 105.1 760.9 102.7 727.8 101.4 695.0 C 99.0 634.1 100.0 573.0 100.0 512.0
        C 100.0 451.0 99.0 389.9 101.4 329.0 C 102.7 296.2 105.1 263.1 112.9 231.2
        C 119.9 202.8 132.7 174.0 153.3 153.3 C 174.0 132.7 202.8 119.9 231.2 112.9
        C 263.1 105.1 296.2 102.7 329.0 101.4 C 389.9 99.0 451.0 100.0 512.0 100.0
        C 573.0 100.0 634.1 99.0 695.0 101.4 C 727.8 102.7 760.9 105.1 792.8 112.9
        C 821.2 119.9 850.0 132.7 870.7 153.3 C 891.3 174.0 904.1 202.8 911.1 231.2
        C 918.9 263.1 921.3 296.2 922.6 329.0 C 925.0 389.9 924.0 451.0 924.0 512.0 Z"/>

    <clipPath id="plateClip">
      <use href="#plate"/>
    </clipPath>

    <linearGradient id="plateFill" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F82BD"/>
      <stop offset="1" stop-color="#1D3A5C"/>
    </linearGradient>

    <linearGradient id="caseFill" x1="512" y1="312" x2="512" y2="712" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F7FA"/>
      <stop offset="1" stop-color="#CBD3DD"/>
    </linearGradient>

    <linearGradient id="baseFill" x1="512" y1="656" x2="512" y2="712" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9B4C3"/>
      <stop offset="1" stop-color="#8E9BAD"/>
    </linearGradient>

    <clipPath id="caseClip">
      <rect x="212" y="312" width="600" height="400" rx="78"/>
    </clipPath>

    <filter id="caseShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0A1B2E" flood-opacity="0.45"/>
    </filter>
  </defs>

  <use href="#plate" fill="url(#plateFill)"/>

  <g clip-path="url(#plateClip)">
    <!-- the drive case -->
    <rect x="212" y="312" width="600" height="400" rx="78" fill="url(#caseFill)" filter="url(#caseShadow)"/>
    <!-- the lower shell of the enclosure, and the seam above it -->
    <g clip-path="url(#caseClip)">
      <rect x="212" y="656" width="600" height="56" fill="url(#baseFill)"/>
      <rect x="212" y="652" width="600" height="4" fill="#7E8B9D" fill-opacity="0.55"/>
      <circle cx="740" cy="684" r="14" fill="#52C79B"/>
    </g>
    <!-- bevel along the inside of the case edge -->
    <rect x="218" y="318" width="588" height="388" rx="72"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4"/>

    <!-- the prompt, drawn as strokes so no font is involved -->
    <g fill="none" stroke="#1D3A5C" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 329 392 L 459 484 L 329 576"/>
      <path d="M 515 576 L 695 576"/>
    </g>
  </g>
</svg>
