# Cuts a release: a `v*` tag produces a notarized DMG on a GitHub release and an updated
# cask in alecdwm/homebrew-tap. docs/release.md is the procedure around it;
# docs/design/packaging.md is the design.
#
# The tag is the trigger and the version is not taken from it: `check` refuses to go on
# unless the tag is exactly `v$(cat VERSION)` and every location `scripts/set-version.sh`
# stamps agrees with that file.
#
# Repository secrets, all seven required (docs/release.md says how to produce each):
#
#   DEVELOPER_ID_P12_BASE64      base64 of a .p12 holding the Developer ID Application
#                                certificate and its private key
#   DEVELOPER_ID_P12_PASSWORD    the password that .p12 was exported with
#   PROVISIONING_PROFILE_BASE64  base64 of the Developer ID provisioning profile for
#                                org.shirls.sshdrive. It must have been issued for the
#                                certificate above, or AMFI kills the agent at exec; the
#                                build fails rather than ship without keychain access.
#   APP_STORE_CONNECT_KEY_BASE64 base64 of the App Store Connect API key (.p8)
#   APP_STORE_CONNECT_KEY_ID     that key's id
#   APP_STORE_CONNECT_ISSUER     the issuer uuid
#   TAP_GITHUB_TOKEN             a token that may push to alecdwm/homebrew-tap. The
#                                repository's own GITHUB_TOKEN cannot reach another repo.
#
# Re-running a release: dispatch this workflow with the ref set to the tag and the same tag
# as the `tag` input. The helper build runs from the ref the run was started on, so
# dispatching from a branch would build that branch's helper against the tag's app.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing v* tag to build. Start the run from that tag.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: version and swift test
    runs-on: ubuntu-latest
    # The Swift toolchain the package is developed against (CLAUDE.md). The whole package
    # builds and tests on Linux; the testbed-gated tests skip themselves without
    # SSHDRIVE_TESTBED.
    container: swift:6.3-noble
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Index's CSQLite system-library target links against the system sqlite3.
      # libsqlite3 is the CSQLite target's system library. python3 is what the fake
      # ssh of ServerModel binds its AF_UNIX control sockets with; without it the
      # stub leaves a plain file and every scenario that checks for a socket fails.
      - name: Install libsqlite3 and python3
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev python3

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: The tag and VERSION must agree
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version=$(tr -d ' \t\r\n' < VERSION)
          if [ "$TAG" != "v$version" ]; then
            echo "the tag is $TAG and VERSION says $version."
            echo "Run scripts/set-version.sh ${TAG#v} and commit before tagging."
            exit 1
          fi
          scripts/set-version.sh --check
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: swift test
        working-directory: Packages/SSHDriveCore
        run: swift test

  # cargo test and cargo clippy run in this workflow's own `test` job, which gates the
  # builds below it, so the release is gated on the crate's tests as well as the package's.
  helper:
    name: helper
    uses: ./.github/workflows/helper.yml

  release:
    name: build, sign, notarize
    needs: [check, helper]
    # macos-26 is the image carrying Xcode 26, which is what the project is built and
    # tested with. The macos-15 image tops out at Xcode 16; the deployment target is
    # macOS 14 either way, but nothing has been built against that SDK.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Select Xcode 26
        run: |
          set -eu
          app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -1 || true)
          if [ -z "$app" ]; then
            echo "no Xcode 26 on this runner:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      # The helper binaries are embedded before the signature, so they have to be here
      # before scripts/release.sh runs. An artifact download loses the executable bit.
      - uses: actions/download-artifact@v4
        with:
          name: helper-bundle
          path: Resources/helper

      - name: Make the helper binaries executable
        run: |
          set -eu
          chmod 755 Resources/helper/sshdrive-helper-*
          ls -l Resources/helper
          cat Resources/helper/manifest.json

      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/sshdrive-release.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "::add-mask::$password"

          security create-keychain -p "$password" "$keychain"
          # -lut without -l: no lock on sleep, and a six-hour timeout, which outlasts a
          # notarization that queues.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          printf %s "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Without a partition list, codesign's use of the imported key raises a UI
          # prompt that a runner cannot answer and fails with errSecInternalComponent.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          # codesign searches the keychain list, not a keychain named on a command line.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # By SHA-1, not by name: two certificates can share a name and codesign then
          # refuses as ambiguous. This is the hash the profile is checked against.
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "the .p12 holds no Developer ID Application identity:"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          security find-identity -v -p codesigning "$keychain"

          {
            echo "KEYCHAIN_PATH=$keychain"
            echo "KEYCHAIN_PASSWORD=$password"
            echo "SIGN_IDENTITY=$identity"
          } >> "$GITHUB_ENV"

      - name: Install the provisioning profile and the notarization key
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          set -eu
          profile="$RUNNER_TEMP/SSH_Drive_Developer_ID.provisionprofile"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf %s "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          printf %s "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$profile" "$key"
          # Neither file is copied into the repository, the bundle or the DMG; the profile
          # is embedded in the app and the key's path is all notarytool is given.
          security cms -D -i "$profile" | plutil -convert xml1 -o - - | \
            python3 -c 'import plistlib,sys; p=plistlib.loads(sys.stdin.buffer.read()); print(p.get("Name"), p.get("UUID"), p.get("ExpirationDate"))'
          {
            echo "RELEASE_PROFILE=$profile"
            echo "NOTARY_KEY=$key"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        env:
          # Build here rather than over ssh on the Mac the owner releases from.
          RELEASE_LOCAL: "1"
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER }}
          # A build that could not embed the profile signs without
          # keychain-access-groups, so no stored password or key passphrase works; an
          # unnotarized DMG is refused by Gatekeeper on every other Mac. Neither is a
          # release. Set either to 0 to publish one anyway.
          RELEASE_REQUIRE_PROFILE: "1"
          RELEASE_REQUIRE_NOTARIZATION: "1"
        run: scripts/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sshdrive-dmg
          path: |
            dist/SSH-Drive-*.dmg
            dist/SSH-Drive-*.dmg.sha256
          if-no-files-found: error

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: SSH Drive ${{ needs.check.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/SSH-Drive-${{ needs.check.outputs.version }}.dmg
            dist/SSH-Drive-${{ needs.check.outputs.version }}.dmg.sha256

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/sshdrive-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" \
                "$RUNNER_TEMP/SSH_Drive_Developer_ID.provisionprofile" \
                "$RUNNER_TEMP/developer-id.p12"

  tap:
    name: alecdwm/homebrew-tap
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: sshdrive-dmg
          path: dist

      # packaging/cask/sshdrive.rb is the source of truth for every stanza. Only `version`
      # and `sha256` are rewritten here, from the DMG that was just notarized: the sha256
      # in the repository belongs to the previous release and is never the one published.
      - name: Render the cask
        id: cask
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eu
          dmg="dist/SSH-Drive-$VERSION.dmg"
          sha=$(sha256sum "$dmg" | cut -d' ' -f1)
          # The macOS job wrote its own digest beside the DMG; disagreement means the
          # artifact and the release are not the same bytes.
          expected=$(cut -d' ' -f1 < "$dmg.sha256")
          if [ "$sha" != "$expected" ]; then
            echo "$dmg hashes to $sha, and $dmg.sha256 says $expected"
            exit 1
          fi
          sed -e "s/^  version \".*\"\$/  version \"$VERSION\"/" \
              -e "s/^  sha256 \".*\"\$/  sha256 \"$sha\"/" \
              packaging/cask/sshdrive.rb > "$RUNNER_TEMP/sshdrive.rb"
          grep -q "^  version \"$VERSION\"\$" "$RUNNER_TEMP/sshdrive.rb"
          grep -q "^  sha256 \"$sha\"\$" "$RUNNER_TEMP/sshdrive.rb"
          ruby -c "$RUNNER_TEMP/sshdrive.rb"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      # `brew tap alecdwm/tap` resolves to alecdwm/homebrew-tap, and the token resolves the
      # cask file name: Casks/sshdrive.rb is what `brew install --cask sshdrive` reads.
      - name: Push it to the tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eu
          git clone --depth 1 \
            "https://x-access-token:$TAP_GITHUB_TOKEN@github.com/alecdwm/homebrew-tap.git" \
            "$RUNNER_TEMP/tap"
          cp "$RUNNER_TEMP/sshdrive.rb" "$RUNNER_TEMP/tap/Casks/sshdrive.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sshdrive.rb
          if git diff --cached --quiet; then
            echo "the tap already carries this cask; nothing to push"
            exit 0
          fi
          git commit -m "sshdrive $VERSION"
          git push
